name: Mainline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install constrained dependencies
        run: |
          npm ci
          python -m pip install -e './backend[dev,package]' -c backend/requirements-dev.lock
      - name: Build and test frontend and backend
        run: |
          npm test
          python -m pytest backend/tests --basetemp .local-build/ci-pytest
      - name: Generated resource checks
        run: |
          python -m ludo_npc.tools generate --root . --check
          node scripts/generate-help-guide.mjs --check
          python scripts/package-skills.py --check
          node scripts/check-repository.mjs
      - name: Package boundaries
        run: |
          npm run test:sites
      - name: Distributed Skill workflows
        run: python scripts/verify-skills.py
